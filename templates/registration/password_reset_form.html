{% extends 'base.html' %}
{% block title %}Reset password · My-LifeHub{% endblock %}
{% block auth_content %}
<span class="section-kicker">ACCOUNT ACCESS</span><h2>Find your way<br><em>back in.</em></h2>
<p class="auth-description">Enter the email address connected to your account. We'll prepare a reset link.</p>
<form method="post" class="auth-form">{% csrf_token %}<label for="id_email">Email address</label><input id="id_email" name="email" type="email" autocomplete="email" required><button class="primary-button" type="submit">Send reset link <span aria-hidden="true">↗</span></button></form>
<a class="back-link" href="{% url 'accounts:login' %}">← Back to sign in</a>
{% endblock %}
